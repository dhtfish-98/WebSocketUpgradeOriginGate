[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "websocket-upgrade-origin-gate"
version = "0.1.0"
description = "Local WebSocket upgrade gate for origin, host, and session checks"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "dhtfish98" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
]

[tool.hatch.build.targets.wheel]
packages = ["src/websocket_upgrade_origin_gate"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/pyproject.toml",
  "/LICENSE",
]
